<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Películas</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.2.46/dist/vue.global.prod.js"></script>
  <style>

.movie-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
}
    .movie-card {
  background-color: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  padding: 20px;
  margin: 10px;
  text-align: center;
  
}

.movie-card h2 {
  margin: 0;
}

.movie-card button {
  background-color: #007bff;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 5px;
  cursor: pointer;
}

.movie-card img {
      width: 100%;
      height: 200px; 
      object-fit: cover; 
    }
  </style>
</head>
<body>
    <div id="app">
        <h1>Lista de Películas Populares</h1>
        <div class="movie-container">
          <div v-for="movie in movies" :key="movie.id" class="movie-card">
            <img :src="`https://image.tmdb.org/t/p/w500/${movie.poster_path}`" alt="Movie   
     poster">
            <h2>{{ movie.title }}</h2>
            <p>Idioma original: {{ movie.original_language }}</p>
            <button @click="verDetalles(movie.id)">Ver Detalles</button>
          </div>
        </div>
      </div>
  <script>
    
    const app = Vue.createApp({
      data() {
        
        return {
          movies: [],
        };
      },
      mounted() {
        const options = {
          method: 'GET',
          headers: {
            accept: 'application/json',
             Authorization: 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI1ZmY3NTQxNDdmZDNlZWQ1Y2ZjOGVlY2Q2OGM5OTBkMCIsIm5iZiI6MTcyODU0Mjk5Ny4xMTEzNjQsInN1YiI6IjY3MDc2ZmE3ZDA2MTZjN2IxOWZiMzg2ZCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.LmvxdcUAPLMHFuaTJejXvsnb8nnFcPZ3GfLnOS5pQVk'
          },
        };

        fetch('https://api.themoviedb.org/3/movie/popular?language=en-US&page=1', options)
          .then(response => response.json())
          .then(response => this.movies = response.results) 
          .catch(err => console.error(err));
      },
      methods: {

        verDetalles(movieId) {
          window.location.href = `movie.html?id=${movieId}`;
       // console.log(movieId);
        },

      }

      
    }).mount('#app');
  </script>
</body>
</html>
